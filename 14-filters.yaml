- name: default value
  hosts: localhost
  tasks:
  - name: print default value
    ansible.builtin.debug:
      msg: "HELLO {{course | default('Ansible')}}"

- name : upper case
  hosts: localhost
  vars:
    greeting: "good morning"
  tasks:
  - name: conver to upper case
    ansible.builtin.debug:
      msg: "{{greeting | upper}}"

- name: min and max
  hosts: localhost
  vars:
    ags: [2,3,5]
  tasks:
  - name: print min and max
    ansible.builtin.debug:
      msg: "min age: {{ags | min}}, max age : {{ags | max}}"