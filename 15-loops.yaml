- name: demo on loops
  hosts: localhost
  tasks:
  - name: print names
    ansible.builtin.debug:
      msg: "hello {{item}}"
    loop:
    - linux
    - shell
    - ansible

- name: install package
  hosts: web
  tasks:
  - name: install packages
    ansible.builtin.debug:
      msg: "install {{item}}"
    loop:
    - mysql
    - nginx
    - postfix